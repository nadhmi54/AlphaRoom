services:
  # PostgreSQL/Auth/Realtime/Storage sont fournis par le projet Supabase Cloud,
  # indépendamment des conteneurs applicatifs lancés par ce fichier.
  # Il n'y a donc plus de service "db" ici. Voir backend/.env.example pour
  # les variables de connexion (DATABASE_URL, SUPABASE_URL, ...).

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alpharoom-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    networks:
      - alpharoom_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in the root .env file}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in the root .env file}
    container_name: alpharoom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"   # 8081 en local pour eviter un conflit avec le port 80 par defaut
    networks:
      - alpharoom_net

networks:
  alpharoom_net:
    driver: bridge
