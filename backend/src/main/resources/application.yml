server:
  port: 8080

spring:
  application:
    name: alpharoom-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alpharoom}
    username: ${SPRING_DATASOURCE_USERNAME:alpharoom}
    password: ${SPRING_DATASOURCE_PASSWORD:alpharoom}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
